# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Reference: https://docs.coderabbit.ai/reference/configuration

language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  review_details: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      requirements: >-
        Conventional Commits: `type: summary` or `type(scope): summary`, where type is one of
        feat, fix, refactor, chore, docs, test, style, perf, ci, build.
  tools:
    # ESLint + Prettier are the project's linters; Biome would duplicate them with conflicting rules.
    biome:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  code_guidelines:
    # Added on top of the defaults, which already include every **/AGENTS.md.
    filePatterns:
      - "CONTEXT.md"
      - "docs/adr/*.md"
